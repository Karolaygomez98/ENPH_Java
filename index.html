<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENPH - Cuadernillo 2 (Encuestador)</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1>DANE - Encuesta Nacional de Presupuestos Hogares (ENPH)</h1>
        <h2>Cuadernillo 2: Gastos Diarios</h2>
        
        <div class="user-selector">
            <label for="role">Rol de trabajo:</label>
            <select id="role">
                <option value="encuestador" selected>Encuestador</option>
                <option value="supervisor">Supervisor</option>
                <option value="critico">Crítico / Digitador</option>
            </select>
        </div>
    </header>

    <main id="app-container">
        <!-- Formulario del Encuestador -->
        <section id="modulo-encuestador">
            <h3>Registro de Alimentos y Bebidas</h3>
            
            <form id="form-gastos">
                <!-- Selección de Producto de la Canasta -->
                <div class="form-group">
                    <label for="producto-select">Producto:</label>
                    <select id="producto-select" required>
                        <option value="">-- Seleccione un producto --</option>
                        <option value="arroz">Arroz</option>
                        <option value="leche">Leche entera</option>
                        <option value="huevos">Huevos</option>
                        <option value="pan">Pan aliñado / corriente</option>
                        <option value="aceite">Aceite vegetal</option>
                        <option value="otro">Otro (Especificar)</option>
                    </select>
                </div>

                <!-- Campo dinámico para 'Otro' producto -->
                <div class="form-group hidden" id="campo-otro-producto">
                    <label for="otro-producto-nombre">Escriba el nombre del producto:</label>
                    <input type="text" id="otro-producto-nombre" placeholder="Ej. Fruta local, dulce típico...">
                </div>

                <!-- Cantidad y Valor -->
                <div class="form-group">
                    <label for="cantidad">Cantidad:</label>
                    <input type="number" id="cantidad" min="0.01" step="0.01" required placeholder="Ej. 1">
                </div>

                <div class="form-group">
                    <label for="valor">Valor pagado ($ COP):</label>
                    <input type="number" id="valor" min="0" step="50" required placeholder="Ej. 5500">
                </div>

                <button type="submit">Agregar al Cuadernillo</button>
            </form>

            <!-- Tabla resumen de productos ingresados por el Encuestador -->
            <section class="tabla-resumen">
                <h4>Productos registrados hoy</h4>
                <table id="tabla-gastos">
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th>Cantidad</th>
                            <th>Valor Pagado</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Aquí se agregarán los registros con JavaScript -->
                    </tbody>
                </table>
            </section>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
